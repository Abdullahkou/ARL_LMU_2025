algo_config:
    algorithm: Custom_DQN
    hyper_params:
        batch_size: 256
        buffer_size: 30000
        clip_grad_norm: 10.0
        double_q: true
        dueling: false
        ensemble_aggregation: avg
        epsilon_decay_steps: 250000
        gamma: 0.99
        gradient_steps: 1
        hidden_sizes:
        - 256
        - 256
        independent_heads: false
        learning_rate: 0.0003
        learning_starts: 300
        max_epsilon: 0.5
        min_epsilon: 0.05
        n_q_heads: 3
        target_update_interval: 1000
        tau: 1.0
        train_freq: 1
        use_ebql: true
    ignore_hyper_params: false
env_id: LunarLander-v3
eval_env_seed: 3
eval_episodes: 2
eval_phases: 2
record_heads: true
record_training: true
seeds:
- 0
- 1
steps: 1000
train_env_seed: 2
train_log_phases: 4
